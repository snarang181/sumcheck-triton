[project]
name = "zkduel"
version = "1.0.0"
description = "zkDuel: GPU SumCheck benchmark suite for Triton and CUDA"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy",
    "torch",
    "triton",
]

[project.optional-dependencies]
dev = ["pre-commit", "pytest", "ruff"]
plot = ["matplotlib"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
"benchmarks/**/*.py" = ["E402"]
"cuda/check/*.py" = ["E402"]
